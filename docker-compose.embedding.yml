services:
  openviking:
    image: ghcr.io/volcengine/openviking:main
    container_name: openviking
    command: ["python", "-m", "uvicorn", "openviking.storage.vectordb.service.server_fastapi:app", "--host", "0.0.0.0", "--port", "1933"]
    ports:
      - "1933:1933"
    volumes:
      - openviking-data:/app/data
    environment:
      - VIKINGDB_PERSIST_PATH=/app/data/vikingdb/
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:1933/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - viking-net

  embedding:
    build: ./embedding
    container_name: embedding
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - viking-net

networks:
  viking-net:
    driver: bridge

volumes:
  openviking-data:
